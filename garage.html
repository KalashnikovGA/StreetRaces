<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>На слабо — гараж</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Onest:wght@400;500;600&display=swap" />
</head>
<body>
  <div class="chrome" id="chrome"></div>

  <div class="shell">
    <!-- Машина: слева витрина, справа цифры и действия. Порядок из оригинала. -->
    <section class="strip hero">
      <div class="hero-grid">
        <div class="stage">
          <canvas id="scene"></canvas>
          <p class="stage-note" id="loading">Загружаю модель</p>
          <button class="btn quiet small stage-spin" id="toggle-spin" aria-pressed="true">Вращение</button>
        </div>

        <div class="plate-card">
          <h1 id="car-nick">Корытце</h1>
          <p class="model" id="car-model">«Заря-965»</p>
          <table class="sheet card-sheet" id="car-sheet"></table>
          <p class="ceiling" id="ceiling"></p>
          <div class="actions">
            <a class="btn primary" id="race" href="/">На слабо</a>
            <button class="btn" id="sell" type="button">Продать</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Запчасти: тот же ряд деталей с уровнями, что стоял под машиной (§4) -->
    <section class="strip">
      <header>
        <h2>Запчасти</h2>
        <span class="note" id="parts-note"></span>
      </header>
      <div class="parts" id="parts"></div>
    </section>

    <!-- Гараж списком, не сеткой карточек (§9) -->
    <section class="strip">
      <header>
        <h2>Места в гараже</h2>
        <span class="note" id="slots-note"></span>
      </header>
      <div class="body tight">
        <ul class="rows garage-rows" id="car-list"></ul>
      </div>
    </section>

    <section class="strip">
      <header>
        <h2>Последние гонки</h2>
        <span class="note">Двор против двора: важен не рекорд, а кто именно тебя обошёл</span>
      </header>
      <div class="body tight">
        <ul class="rows log-rows" id="log"></ul>
      </div>
    </section>

    <section class="strip">
      <header><h2>Всего за карьеру</h2></header>
      <div class="career" id="career"></div>
    </section>
  </div>

  <footer id="footer"></footer>
  <script type="module" src="/src/garage/boot.ts"></script>
</body>
</html>
