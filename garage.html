<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>На слабо — гараж</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="/src/garage/garage.css" />
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <h1 class="mark">На <span>слабо</span></h1>
      <p class="tagline">Гараж</p>
      <div class="purse">
        <span class="coin" title="Монеты">148 200</span>
        <span class="gold" title="Золотые монеты">36</span>
      </div>
      <nav class="tabs">
        <a href="/">Заезд</a>
        <a href="/sandbox.html">Песочница</a>
      </nav>
    </header>

    <div class="layout">
      <!-- Гараж списком — §9, буквально как в оригинале -->
      <aside class="cars">
        <h2 class="eyebrow">Мои машины</h2>
        <ul id="car-list"></ul>
      </aside>

      <main class="stage">
        <canvas id="scene"></canvas>
        <div class="stage-loading" id="loading">Загружаю модель…</div>

        <div class="stage-plate">
          <p class="nick" id="car-nick">Корытце</p>
          <p class="model" id="car-model">«Заря-965»</p>
        </div>

        <div class="stage-hint">Зажми мышь — покрутить камеру. Колесо — приблизить.</div>

        <div class="stage-tools">
          <button class="icon" id="toggle-spin" aria-pressed="true" title="Вращение подиума">⟳</button>
          <div class="lamps" id="lamps"></div>
        </div>
      </main>

      <aside class="panel-right">
        <!-- Pimp отдельно от характеристик — §2, §4 -->
        <section class="panel">
          <h2 class="eyebrow">Pimp</h2>
          <p class="hint">Косметика. На заезд не влияет.</p>
          <p class="sub">Окраска</p>
          <div class="swatches" id="paints"></div>
          <p class="sub">Номер</p>
          <input class="plate" id="plate" maxlength="9" value="К 348 ЕЕ" spellcheck="false" />
        </section>

        <!-- Характеристики: терминология оригинала — §4 -->
        <section class="panel">
          <h2 class="eyebrow">Характеристики</h2>
          <table class="specs" id="specs"></table>
          <div class="rating">
            <span>Рейтинг машины</span>
            <b id="rating">—</b>
          </div>
          <p class="hint" id="ceiling"></p>
        </section>
      </aside>
    </div>
  </div>
  <script type="module" src="/src/garage/boot.ts"></script>
</body>
</html>
