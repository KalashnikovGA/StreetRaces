<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>На слабо — гараж</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Onest:wght@400;500;600&display=swap" />
</head>
<body>
  <div class="chrome" id="chrome"></div>

  <div class="shell">
    <!-- Витрина: слева машина, справа цифры и действия -->
    <section class="strip showcase">
      <div class="stage"><canvas id="scene"></canvas></div>
      <div class="card">
        <h1 id="car-nick">Малыш</h1>
        <p class="model" id="car-model">«Vogel 190»</p>
        <div class="facts" id="car-facts"></div>
        <p class="note" id="ceiling"></p>
        <div class="actions">
          <a class="btn primary" id="race" href="/">На слабо</a>
          <button class="btn" id="sell" type="button">Продать</button>
        </div>
      </div>
    </section>

    <!-- Запчасти: ряд клеток с уровнем цифрой -->
    <div class="tiles parts" id="parts"></div>

    <!-- Места в гараже: клетки с машинами, занятые и пустые -->
    <div class="tiles slots" id="slots"></div>

    <!-- Полоса уровня -->
    <div class="level">
      <span id="level-label">Класс A</span>
      <span class="rail"><i id="level-fill"></i></span>
      <span id="level-left"></span>
    </div>

    <!-- Лента вызовов -->
    <section class="strip">
      <div class="plate-head">
        Последние гонки
        <span class="note">Важен не рекорд, а кто именно тебя обошёл</span>
      </div>
      <div class="body tight">
        <ul class="rows log-rows" id="log"></ul>
      </div>
    </section>

    <!-- Сводка: две колонки -->
    <section class="strip">
      <div class="career" id="career"></div>
    </section>

    <div class="band"></div>
    <div class="baseline">
      <span id="progress">Заездов в классе: 370</span>
      <span class="mark"><i class="flag"></i>НА СЛАБО<i class="flag"></i></span>
    </div>
  </div>

  <footer id="footer"></footer>
  <script type="module" src="/src/garage/boot.ts"></script>
</body>
</html>
