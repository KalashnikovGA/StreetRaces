<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>На слабо — заезд</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700;1,800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
</head>
<body>
  <div class="chrome" id="chrome"></div>

  <div class="shell">
    <section class="strip">
      <canvas class="track" id="track"></canvas>
      <div class="bar">
        <button class="btn primary" id="run" type="button">Старт</button>
        <button class="btn" id="again" type="button">Другой заезд</button>
        <button class="btn quiet" id="sound" type="button">Звук включён</button>
        <output class="verdict" id="verdict"></output>
      </div>
    </section>

    <section class="strip">
      <header>
        <h2>Расклад до старта</h2>
        <span class="note" id="conditions"></span>
      </header>
      <div class="body tight">
        <table class="sheet compare" id="odds"></table>
      </div>
    </section>

    <section class="strip">
      <header>
        <h2>Повтор</h2>
        <span class="note">Весь заезд лежит в ссылке. Откроется у кого угодно, без регистрации</span>
      </header>
      <div class="body share">
        <input type="text" id="link" readonly />
        <button class="btn" id="copy" type="button">Скопировать</button>
      </div>
    </section>

    <section class="strip">
      <header>
        <h2>Что произошло в заезде</h2>
        <span class="note">Отладочная панель: в игре причину показывает картинка, а не текст</span>
      </header>
      <pre class="out" id="events"></pre>
    </section>
  </div>

  <footer id="footer"></footer>
  <script type="module" src="/src/game/main.ts"></script>
</body>
</html>
