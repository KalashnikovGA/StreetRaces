<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>На слабо — Pimp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Onest:wght@400;500;600&display=swap" />
</head>
<body>
  <div class="chrome" id="chrome"></div>

  <div class="shell">
    <section class="strip showcase">
      <div class="stage"><canvas id="scene"></canvas></div>
      <div class="card">
        <h1 id="car-nick">Малыш</h1>
        <p class="model" id="car-model">«Vogel 190»</p>
        <p class="note">Косметика. На заезд не влияет — ни на один балл.</p>
        <div class="actions">
          <button class="btn" id="reset" type="button">Сбросить</button>
        </div>
      </div>
    </section>

    <div class="tiles pimp-tabs" id="pimp-tabs"></div>
    <div class="tiles swatches" id="paints"></div>

    <section class="strip">
      <div class="plate-head">Номер<span class="note">Свободным текстом</span></div>
      <div class="body">
        <input class="plate" id="plate" maxlength="9" value="К 348 ЕЕ" spellcheck="false" />
      </div>
    </section>

    <div class="band"></div>
    <div class="baseline">
      <span>Окраска и номер видны всем, кто откроет ссылку на заезд</span>
      <span class="mark"><i class="flag"></i>НА СЛАБО<i class="flag"></i></span>
    </div>
  </div>

  <footer id="footer"></footer>
  <script type="module" src="/src/pimp/main.ts"></script>
</body>
</html>
