<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>На слабо — Pimp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Onest:wght@400;500;600&display=swap" />
</head>
<body>
  <div class="chrome" id="chrome"></div>

  <div class="shell">
    <section class="strip hero">
      <div class="hero-grid">
        <div class="stage">
          <canvas id="scene"></canvas>
        </div>

        <div class="plate-card">
          <h1 id="car-nick">Корытце</h1>
          <p class="model" id="car-model">«Заря-965»</p>
          <p class="pimp-note">Косметика. На заезд не влияет — ни на один балл.</p>

          <p class="sub">Окраска</p>
          <div class="swatches" id="paints"></div>

          <p class="sub">Номер</p>
          <input class="plate" id="plate" maxlength="9" value="К 348 ЕЕ" spellcheck="false" />
        </div>
      </div>
    </section>

  </div>

  <footer id="footer"></footer>
  <script type="module" src="/src/pimp/main.ts"></script>
</body>
</html>
