<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>На слабо — песочница баланса</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,600;1,700;1,800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
</head>
<body>
  <div class="chrome" id="chrome"></div>

  <div class="shell">
    <section class="strip">
      <header>
        <h2>Условия заезда</h2>
        <span class="note">Шаг 1: баланс проверяется руками, ползунками и пачкой заездов</span>
      </header>
      <div class="body two">
        <div>
          <div class="field"><label>Дистанция</label><select id="distance">
            <option value="short">402 метра</option>
            <option value="medium" selected>800 метров</option>
            <option value="long">1600 метров</option>
          </select></div>
          <div class="field"><label>Покрытие</label><select id="surface">
            <option value="dry">сухо</option><option value="wet">мокро</option>
          </select></div>
          <div class="field"><label>Профиль</label><select id="profile">
            <option value="flat">ровно</option><option value="uphill">в подъём</option>
          </select></div>
        </div>
        <div>
          <div class="field"><label>Сид</label><input type="text" id="seed" value="k7m2xq9b" /></div>
          <div class="field"><label></label><button class="btn" id="reseed" type="button">Другой сид</button></div>
          <p class="faint">Один сид — один и тот же заезд, всегда. На этом держатся повторы
            по ссылке и серверная проверка ставки.</p>
        </div>
      </div>
    </section>

    <div class="two-strips" id="sides"></div>

    <section class="strip">
      <header><h2>Расклад</h2></header>
      <div class="body tight"><table class="sheet" id="odds"></table></div>
    </section>

    <section class="strip">
      <header>
        <h2>Прогон</h2>
        <span class="note">Эмпирика должна сойтись с формулой</span>
      </header>
      <div class="body">
        <div class="chips">
          <button class="btn small" data-n="1000" type="button">1 000 заездов</button>
          <button class="btn small" data-n="20000" type="button">20 000</button>
          <button class="btn small" data-n="200000" type="button">200 000</button>
        </div>
      </div>
      <pre class="out" id="out">Настрой машины и прогони пачку заездов.</pre>
    </section>
  </div>

  <footer id="footer"></footer>
  <script type="module" src="/src/sandbox/main.ts"></script>
</body>
</html>
